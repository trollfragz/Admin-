<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HiveTiers Admin</title>
<style>
:root{--bg:#121420;--s1:#1a1d2b;--s2:#232738;--line:#2e3348;--tx:#eceef7;--mu:#8e94ab;--ac:#ffbf2f;--ac-ink:#1b1400;--ok:#4cd68a;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,3vw,28px);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px}
.brand i{display:inline-grid;place-items:center;width:26px;height:30px;margin-right:8px;background:var(--ac);color:var(--ac-ink);font-style:normal;font-size:14px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);vertical-align:middle}
main{max-width:860px;margin:0 auto;padding:20px clamp(14px,3vw,28px) 80px}
h2{font-size:18px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{font-size:12px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.muted{color:var(--mu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:11px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.6;pointer-events:none}
.field,select,input[type=number]{background:var(--s2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;outline:0;max-width:100%}
.field{width:100%}
.field:focus,select:focus,input:focus{border-color:var(--ac)}
.search{position:relative}
.search .field{padding:15px 16px;font-size:17px;border-radius:14px}
.mc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mc-top .st{margin-left:auto}
.st{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;text-transform:capitalize;background:color-mix(in srgb,var(--ac) 22%,transparent);color:var(--ac)}
.st.accepted{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.st.completed{background:color-mix(in srgb,#57b6ff 22%,transparent);color:#57b6ff}
.st.declined,.st.cancelled{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.rev{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:14px}
.rev h3{margin:0;font-size:15px}
.game{display:grid;grid-template-columns:110px 1fr auto;gap:8px 10px;align-items:center;background:var(--s2);border-radius:12px;padding:10px}
.game .gm{font-weight:700}
.game .score{display:flex;align-items:center;gap:6px}
.game .score input{width:62px;text-align:center}
.game small{grid-column:1/-1;color:var(--mu)}
.pl{background:var(--s2);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.pl .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row label{font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--bad);font-weight:600;min-height:20px}
.gate{max-width:380px;margin:8vh auto 0;display:grid;gap:12px}
.gate h1{margin:0;font-size:24px}
.or{text-align:center;color:var(--mu);font-size:13px}
.tiers{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tp{background:var(--s2);border-radius:8px;padding:3px 9px;font-size:13px}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:grid;gap:8px;z-index:50;width:min(420px,92vw)}
.toast{background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;box-shadow:0 12px 30px #0006}
@media (max-width:560px){.game{grid-template-columns:1fr}.game .score{justify-content:flex-start}}
</style>
</head>
<body>
<header class="top">
  <span class="brand"><i>H</i>HiveTiers Admin</span>
  <button class="btn sm" id="out" hidden>Log out</button>
</header>
<main id="app"></main>
<div id="toasts" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== SETTINGS: paste your Discord webhook link between the quotes ===== */
// Match results are posted here. Leave as-is to turn Discord messages off.
// Tip: keep this admin file on your own device instead of GitHub, so the link stays private.
const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1556209614763196507/4PW3WSMlTbs7rWqhRHoS0tqmb905rbozAH83omphbxqY5vMu_HWmyOevUaThks2TTrIX';

/* ===== OPTIONAL: one shared tester account =====
   Put the username of ONE account (created on the main site and added to the roles collection) between the quotes.
   Testers then only type its password ("tester key") once per device and stay signed in.
   Leave '' to show the normal username + password login. */
const TESTER_USERNAME = 'Tester';
// WARNING: this password is visible to anyone who opens this file. Do not reuse it anywhere else.
// If someone abuses it, change this account's password in Firebase or delete its roles document.
const TESTER_KEY = 'Hive@tier.ht1';

const firebaseConfig = {
  apiKey: "AIzaSyDk8MafiRLCGoOz84k6Y11wHmEbd_4jiVk",
  authDomain: "hive-tier.firebaseapp.com",
  projectId: "hive-tier",
  storageBucket: "hive-tier.firebasestorage.app",
  messagingSenderId: "268227785809",
  appId: "1:268227785809:web:7628cec5f6a1f71c2ab470"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const TIERS = ['HT1','LT1','HT2','LT2','HT3','LT3','HT4','LT4','HT5','LT5'];
const MODES = [{id:'boxing',name:'Boxing',icon:'🥊'},{id:'midfight',name:'Mid Fight',icon:'⚔️'},{id:'sky',name:'Sky Combat',icon:'☁️'}];
const modeOf = id => MODES.find(m => m.id===id) || {id, name:id, icon:''};

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const esc2 = s => String(s).replace(/([*_`~|>\\])/g,'\\$1');
const fmtDT = ts => new Date(ts).toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
function toast(m){ if(!m) return; const t=document.createElement('div'); t.className='toast'; t.textContent=m; $('#toasts').appendChild(t); setTimeout(()=>t.remove(),4200); }
function errMsg(e){
  const c=(e&&e.code)||'';
  const map={'auth/invalid-credential':'Wrong username or password.','auth/wrong-password':'Wrong username or password.','auth/user-not-found':'Wrong username or password.','auth/too-many-requests':'Too many tries. Wait a minute.','permission-denied':'Firestore refused this. Is the latest firestore.rules published and is this a tester account?'};
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request') return '';
  return map[c]||(e&&e.message)||'Something went wrong.';
}
async function guard(fn){ try{ return await fn(); }catch(e){ console.error(e); toast(errMsg(e)); } }

/* ===== state ===== */
let authReady=false, user=null, isTester=false, autoTried=false, autoErr='';
let USERS=[], PL={}, CHS=[];
let q='', reviewId=null, editUid=null;
const tiersOf = uid => Object.assign({boxing:null,midfight:null,sky:null}, (PL[uid]||{}).tiers||{});
const tn = i => i==null ? 'Unranked' : TIERS[i];
const nameOf = uid => (USERS.find(u => u.uid===uid)||{}).name || '?';
const tierOpts = sel => '<option value="">Unranked</option>' + TIERS.map((t,i) => `<option value="${i}" ${sel===i?'selected':''}>${t}</option>`).join('');

async function loadAll(){
  const [us, ps, cs] = await Promise.all([getDocs(collection(db,'users')), getDocs(collection(db,'players')), getDocs(collection(db,'challenges'))]);
  USERS = us.docs.map(d => ({uid:d.id, name:d.data().ign||'?'})).sort((a,b) => a.name.localeCompare(b.name));
  PL = {}; ps.forEach(d => PL[d.id] = d.data());
  CHS = cs.docs.map(d => Object.assign({id:d.id}, d.data())).sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
}

/* ===== discord ===== */
const webhookOn = () => /^https:\/\/(canary\.|ptb\.)?discord(app)?\.com\/api\/webhooks\//.test(DISCORD_WEBHOOK);
async function sendDiscord(embed){
  if (!webhookOn()) return 'off';
  try{
    const r = await fetch(DISCORD_WEBHOOK, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:'HiveTiers', embeds:[embed], allowed_mentions:{parse:[]}})});
    return r.ok ? 'ok' : 'fail';
  }catch(e){ return 'fail'; }
}
function resultEmbed(c, winner, games, ranks){
  const wName = winner===c.fromUid ? c.fromName : c.toName;
  const gl = games.length ? games.map(g => {
    const w = g.winner===c.fromUid ? c.fromName : c.toName, hi = g.winner===c.fromUid ? g.from : g.to, lo = g.winner===c.fromUid ? g.to : g.from;
    return `${modeOf(g.mode).icon} **${modeOf(g.mode).name}**: ${esc2(w)} won ${hi}–${lo}`;
  }).join('\n') : 'No game details.';
  const rl = uid => `**${esc2(uid===c.fromUid?c.fromName:c.toName)}**: ` + MODES.map(m => `${m.icon} \`${tn(ranks[uid][m.id])}\``).join('  ');
  return {title:'🏁 Match result', description:`**${esc2(c.fromName)}** vs **${esc2(c.toName)}**\nWinner: **${esc2(wName)}** 🏆`, color:0xFFBF2F,
    fields:[{name:'Games', value:gl.slice(0,1000)},{name:'Ranks after this match', value:(rl(c.fromUid)+'\n'+rl(c.toUid)).slice(0,1000)}],
    footer:{text:'HiveTiers'}, timestamp:new Date().toISOString()};
}

/* ===== views ===== */
function loginHTML(){
  if (TESTER_USERNAME) return `<div class="card gate"><h1>Tester access</h1><p class="muted" style="margin:0">Enter the tester key once. This device will stay signed in.</p>
    <form id="login-form" style="display:grid;gap:10px" novalidate>
      <input class="field" id="lp" type="password" autocomplete="current-password" placeholder="Tester key">
      <div class="err" id="lerr" role="alert">${esc(autoErr)}</div>
      <button class="btn primary" type="submit">Open</button>
    </form></div>`;
  return `<div class="card gate"><h1>Admin login</h1><p class="muted" style="margin:0">Only tester accounts can use this page.</p>
    <form id="login-form" style="display:grid;gap:10px" novalidate>
      <input class="field" id="lu" type="text" autocomplete="username" autocapitalize="off" placeholder="Username">
      <input class="field" id="lp" type="password" autocomplete="current-password" placeholder="Password">
      <div class="err" id="lerr" role="alert"></div>
      <button class="btn primary" type="submit">Log in</button>
    </form>
    <div class="or">or</div>
    <button class="btn" data-act="google">Continue with Google</button></div>`;
}
function panelHTML(){
  return `<div class="search"><input class="field" id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search a player name (even one letter)…" value="${esc(q)}"></div>
    <div id="res">${resultsHTML()}</div>`;
}
function resultsHTML(){
  const ql = q.trim().toLowerCase();
  let ms = ql ? CHS.filter(c => (c.fromName+' '+c.toName).toLowerCase().includes(ql)) : CHS.filter(c => c.status==='accepted');
  ms = [...ms].sort((a,b) => (a.status==='accepted'?0:1)-(b.status==='accepted'?0:1) || (b.createdAt||0)-(a.createdAt||0)).slice(0,30);
  const ps = ql ? USERS.filter(u => u.name.toLowerCase().includes(ql)).slice(0,8) : [];
  return `<h2>${ql?'Matches':'Waiting for a result'} <span class="n">${ms.length}</span></h2>
    ${ms.length ? ms.map(matchCard).join('') : `<p class="muted">${ql?'No match found for this name.':'No accepted match is waiting for a result.'}</p>`}
    ${ql ? `<h2>Players <span class="n">${ps.length}</span></h2>${ps.length ? ps.map(playerCard).join('') : '<p class="muted">No player with this name.</p>'}` : ''}`;
}
function matchCard(c){
  const modes = (c.modes&&c.modes.length ? c.modes : []).map(m => modeOf(m).icon+' '+modeOf(m).name).join(' · ');
  const can = c.status==='accepted' || c.status==='completed';
  return `<div class="card" id="m-${c.id}">
    <div class="mc-top"><span><b>${esc(c.fromName)}</b> challenged <b>${esc(c.toName)}</b></span><span class="st ${esc(c.status)}">${esc(c.status)}</span></div>
    <div class="muted">${esc(modes)} · ${fmtDT(c.time)}</div>
    ${c.status==='completed' ? `<div style="margin-top:4px">Winner: <b>${esc(c.winner===c.fromUid?c.fromName:c.toName)}</b></div>` : ''}
    ${c.status==='pending' ? '<div class="muted" style="margin-top:4px">Waiting for the other player to accept.</div>' : ''}
    ${can && reviewId!==c.id ? `<div class="acts" style="margin-top:10px"><button class="btn sm primary" data-act="review" data-id="${c.id}">${c.status==='completed'?'Edit result':'Enter result'}</button></div>` : ''}
    ${reviewId===c.id ? reviewHTML(c) : ''}</div>`;
}
function reviewHTML(c){
  const modes = c.modes && c.modes.length ? c.modes : MODES.map(m => m.id);
  const prev = c.outcome || {};
  const games = modes.map(id => {
    const m = modeOf(id), g = (prev.games||[]).find(x => x.mode===id) || {};
    return `<div class="game" data-mode="${id}">
      <div class="gm">${m.icon} ${m.name}</div>
      <select class="g-win"><option value="">Not played</option><option value="${c.fromUid}" ${g.winner===c.fromUid?'selected':''}>${esc(c.fromName)} won</option><option value="${c.toUid}" ${g.winner===c.toUid?'selected':''}>${esc(c.toName)} won</option></select>
      <div class="score"><input class="g-a" type="number" min="0" max="99" inputmode="numeric" placeholder="0" value="${g.from!=null?g.from:''}"><span>–</span><input class="g-b" type="number" min="0" max="99" inputmode="numeric" placeholder="0" value="${g.to!=null?g.to:''}"></div>
      <small>Score: ${esc(c.fromName)} – ${esc(c.toName)}</small></div>`;
  }).join('');
  const players = [[c.fromUid,c.fromName],[c.toUid,c.toName]].map(([uid,name]) => {
    const t = tiersOf(uid), r = prev.ranks && prev.ranks[uid] ? prev.ranks[uid] : t;
    return `<div class="pl"><b>${esc(name)}</b>${MODES.map(m => `<div class="row"><label>${m.icon} ${m.name}</label><select data-uid="${uid}" data-mode="${m.id}">${tierOpts(r[m.id]==null?null:r[m.id])}</select></div>`).join('')}</div>`;
  }).join('');
  return `<div class="rev">
    <h3>1. Result of each game</h3>${games}
    <h3>2. Overall winner</h3>
    <select id="rv-win"><option value="">Choose the winner…</option><option value="${c.fromUid}" ${c.winner===c.fromUid?'selected':''}>${esc(c.fromName)}</option><option value="${c.toUid}" ${c.winner===c.toUid?'selected':''}>${esc(c.toName)}</option></select>
    <h3>3. Ranks after this match</h3>${players}
    <div class="err" id="rv-err" role="alert"></div>
    <div class="acts"><button class="btn primary" data-act="save-match" data-id="${c.id}">Save and send to both players</button><button class="btn" data-act="close-review">Cancel</button></div>
  </div>`;
}
function playerCard(u){
  const t = tiersOf(u.uid);
  return `<div class="card"><div class="mc-top"><b>${esc(u.name)}</b>${editUid===u.uid?'':`<button class="btn sm" style="margin-left:auto" data-act="edit-player" data-uid="${u.uid}">Edit ranks</button>`}</div>
    <div class="tiers">${MODES.map(m => `<span class="tp">${m.icon} ${tn(t[m.id])}</span>`).join('')}</div>
    ${editUid===u.uid ? `<div class="rev"><div class="pl">${MODES.map(m => `<div class="row"><label>${m.icon} ${m.name}</label><select data-pl="${u.uid}" data-mode="${m.id}">${tierOpts(t[m.id])}</select></div>`).join('')}</div>
      <div class="acts"><button class="btn primary" data-act="save-player" data-uid="${u.uid}">Save ranks</button><button class="btn" data-act="close-edit">Cancel</button></div></div>` : ''}</div>`;
}

let busy = false;
function render(){
  $('#out').hidden = !user || !!TESTER_KEY;
  const app = $('#app');
  if (!authReady) app.innerHTML = '<div class="card">Loading…</div>';
  else if (!user) app.innerHTML = loginHTML();
  else if (!isTester) app.innerHTML = `<div class="card"><b>This account is not a tester.</b><p class="muted" style="margin:8px 0 0">In Firebase → Firestore, create collection <b>roles</b> with Document ID <b>${esc(user.uid)}</b> and a field <b>role</b> = <b>tester</b>. Then refresh.</p></div>`;
  else app.innerHTML = panelHTML();
}
const refreshRes = () => { const r = $('#res'); if (r) r.innerHTML = resultsHTML(); };

/* ===== auth ===== */
onAuthStateChanged(auth, async u => {
  user = u; isTester = false;
  if (!u && TESTER_USERNAME && TESTER_KEY && !autoTried){
    autoTried = true;
    try{ await signInWithEmailAndPassword(auth, TESTER_USERNAME.toLowerCase()+'@hive-tier.local', TESTER_KEY); return; }
    catch(e){ console.error(e); autoErr = (errMsg(e) || 'Auto login failed.') + ' Make sure the account "' + TESTER_USERNAME + '" exists on the main site.'; }
  }
  if (u){
    await guard(async () => {
      const r = await getDoc(doc(db,'roles',u.uid)); isTester = r.exists();
      if (isTester) await loadAll();
    });
  }
  authReady = true; render();
});
$('#out').addEventListener('click', () => guard(() => signOut(auth)));

/* ===== actions ===== */
function readRanks(selector, uid){
  const out = {};
  MODES.forEach(m => { const v = $(`${selector}[data-mode="${m.id}"]`).value; out[m.id] = v===''?null:Number(v); });
  return out;
}
function historyFor(uid, newTiers){
  const old = tiersOf(uid), hist = [...((PL[uid]||{}).history||[])];
  MODES.forEach(m => { if (newTiers[m.id]!==null && newTiers[m.id]!==old[m.id]) hist.push({mode:m.id, tier:newTiers[m.id], date:Date.now()}); });
  return hist;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id, uid = el.dataset.uid;
  switch (el.dataset.act){
    case 'google': guard(() => signInWithPopup(auth, new GoogleAuthProvider())); break;
    case 'review': reviewId = id; editUid = null; refreshRes(); $('#m-'+id).scrollIntoView({behavior:'smooth', block:'start'}); break;
    case 'close-review': reviewId = null; refreshRes(); break;
    case 'edit-player': editUid = uid; reviewId = null; refreshRes(); break;
    case 'close-edit': editUid = null; refreshRes(); break;

    case 'save-player': guard(async () => {
      if (busy) return; busy = true; el.disabled = true;
      try{
        const tiers = {}; MODES.forEach(m => { const v = $(`select[data-pl="${uid}"][data-mode="${m.id}"]`).value; tiers[m.id] = v===''?null:Number(v); });
        await setDoc(doc(db,'players',uid), {tiers, history:historyFor(uid,tiers), updatedBy:user.uid, updatedAt:Date.now()});
        await loadAll(); editUid = null; refreshRes(); toast('Ranks saved for '+nameOf(uid));
      } finally { busy = false; el.disabled = false; }
    }); break;

    case 'save-match': guard(async () => {
      if (busy) return;
      const c = CHS.find(x => x.id===id); if (!c) return;
      const err = m => { $('#rv-err').textContent = m; };
      err('');
      const winner = $('#rv-win').value;
      if (!winner) return err('Choose the overall winner.');
      const games = [];
      for (const row of $$('.game', $('#m-'+id))){
        const w = $('.g-win', row).value; if (!w) continue;
        const a = Number($('.g-a', row).value || 0), b = Number($('.g-b', row).value || 0);
        if (!Number.isInteger(a) || !Number.isInteger(b) || a<0 || b<0 || a>99 || b>99) return err('Scores must be whole numbers from 0 to 99.');
        games.push({mode:row.dataset.mode, winner:w, from:a, to:b});
      }
      const ranks = {[c.fromUid]:readRanks(`select[data-uid="${c.fromUid}"]`), [c.toUid]:readRanks(`select[data-uid="${c.toUid}"]`)};
      const wName = winner===c.fromUid ? c.fromName : c.toName;
      if (!confirm(`Save this result?\n\nWinner: ${wName}\nBoth players will see it in My challenges and Discord will get a message.`)) return;
      busy = true; el.disabled = true;
      try{
        const b = writeBatch(db);
        [c.fromUid, c.toUid].forEach(u => b.set(doc(db,'players',u), {tiers:ranks[u], history:historyFor(u,ranks[u]), updatedBy:user.uid, updatedAt:Date.now()}));
        b.update(doc(db,'challenges',c.id), {status:'completed', winner, awaiting:null, outcome:{winner, games, ranks, at:Date.now()}});
        await b.commit();
        const d = await sendDiscord(resultEmbed(c, winner, games, ranks));
        await loadAll(); reviewId = null; refreshRes();
        toast(d==='fail' ? 'Saved. Players can see it, but the Discord message failed.' : d==='off' ? 'Saved. Players can see it now. (Discord is off: no webhook link set.)' : 'Saved. Players can see it and Discord got the message.');
      } finally { busy = false; el.disabled = false; }
    }); break;
  }
});
document.addEventListener('input', e => { if (e.target.id==='q'){ q = e.target.value; reviewId = null; editUid = null; refreshRes(); } });
document.addEventListener('change', e => {
  // when a game winner is picked and no overall winner is chosen yet, suggest the one with more game wins
  if (!e.target.classList.contains('g-win')) return;
  const card = e.target.closest('.rev'), sel = $('#rv-win'); if (!card || !sel) return;
  const counts = {}; $$('.g-win', card).forEach(s => { if (s.value) counts[s.value] = (counts[s.value]||0)+1; });
  const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  if (entries.length && (!entries[1] || entries[0][1]>entries[1][1]) && (sel.value==='' || sel.dataset.auto==='1')){ sel.value = entries[0][0]; sel.dataset.auto = '1'; }
});
document.addEventListener('submit', e => {
  if (e.target.id!=='login-form') return;
  e.preventDefault();
  guard(async () => {
    const u = TESTER_USERNAME || $('#lu').value.trim(), p = $('#lp').value;
    if (!/^[A-Za-z0-9_]{3,16}$/.test(u)) return $('#lerr').textContent = 'Enter your username (3 to 16 letters, numbers or underscores).';
    if (!p) return $('#lerr').textContent = TESTER_USERNAME ? 'Enter the tester key.' : 'Enter your password.';
    $('#lerr').textContent = '';
    await signInWithEmailAndPassword(auth, u.toLowerCase()+'@hive-tier.local', p);
  });
});
render();
</script>
</body>
</html>
